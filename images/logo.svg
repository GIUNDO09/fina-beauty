  <defs><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7c87e"/><stop offset="1" stop-color="#bf8f2c"/></linearGradient></defs>
  <!-- Emblème losange -->
  <g transform="rotate(45 170 66)" fill="none" stroke="url(#gold)">
    <rect x="143" y="39" width="54" height="54" rx="11" stroke-width="2.4"/>
    <rect x="149" y="45" width="42" height="42" rx="9" stroke-width="1" opacity="0.5"/>
  </g>
  <g transform="translate(170,43)" fill="url(#gold)">
